<text x="45" y="52" class="title">Learning local hypergraph equivalence</text><text x="45" y="85" class="sub">LearnedSinkhornMatcher · architecture overview · schematic, not a trained output</text><rect x="40" y="155" width="260" height="150" rx="14" fill="white" stroke="#bacbd9"/><text x="56" y="195" class="label">Incidence stars</text><text x="56" y="230" class="small">B_x and B_y</text><text x="56" y="265" class="small">Rows: incident hyperedges</text><path d="M 305 230 h 22 l -6 -6 m 6 6 l -6 6" fill="none" stroke="#137f84" stroke-width="3"/><rect x="335" y="155" width="260" height="150" rx="14" fill="white" stroke="#bacbd9"/><text x="351" y="195" class="label">Learned pair encoder</text><text x="351" y="230" class="small">Symmetric column features</text><text x="351" y="265" class="small">Shared neural networks</text><path d="M 600 230 h 22 l -6 -6 m 6 6 l -6 6" fill="none" stroke="#137f84" stroke-width="3"/><rect x="630" y="155" width="260" height="150" rx="14" fill="white" stroke="#bacbd9"/><text x="646" y="195" class="label">Learned cost + Sinkhorn</text><text x="646" y="230" class="small">C_theta → coupling P</text><text x="646" y="265" class="small">Total transport mass = 1</text><path d="M 895 230 h 22 l -6 -6 m 6 6 l -6 6" fill="none" stroke="#137f84" stroke-width="3"/><rect x="925" y="155" width="260" height="150" rx="14" fill="white" stroke="#bacbd9"/><text x="941" y="195" class="label">Binary classifier</text><text x="941" y="230" class="small">Matched features + summaries</text><text x="941" y="265" class="small">Class 0 or class 1</text><text x="45" y="365" class="label">Random initialization → train-only pretraining → supervised training → validation-selected checkpoint</text><text x="45" y="405" class="sub">The primary model does not consume a fixed L1 cost or the exact oracle output.</text></svg>